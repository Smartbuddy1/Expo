<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="borderGlow" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Base App Badge -->
  <rect width="64" height="64" rx="16" fill="url(#cardBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#borderGlow)" stroke-width="2.5"/>

  <!-- Digital Business Card -->
  <rect x="9" y="13" width="46" height="38" rx="7" fill="#131C31" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Card Magnetic / Header Band -->
  <path d="M9 20C9 16.5 11.5 13 16 13H48C52.5 13 55 16.5 55 20V21H9V20Z" fill="url(#borderGlow)" fill-opacity="0.25"/>

  <!-- User Silhouette / Avatar -->
  <circle cx="21" cy="29" r="5" fill="#10B981"/>
  <path d="M14 43C14 38.5 17 37 21 37C25 37 28 38.5 28 43" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Digital Identity Detail Lines -->
  <rect x="32" y="27" width="16" height="3" rx="1.5" fill="#FFFFFF"/>
  <rect x="32" y="33" width="12" height="2.5" rx="1.25" fill="#38BDF8"/>
  <rect x="32" y="38.5" width="8" height="2" rx="1" fill="#94A3B8"/>

  <!-- Contactless NFC Wave in Corner -->
  <path d="M47 18C48.5 19.5 49.5 21.5 49.5 23.5" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
</svg>